theme = "kanagawa-dragon"

[editor]
cursorline = true
rulers = [100]
bufferline = "always"

[editor.statusline]
left = ["mode", "file-name", "file-modification-indicator", "version-control", "spinner"]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-inlay-hints = true
